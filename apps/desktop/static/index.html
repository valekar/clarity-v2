<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'"
    />
    <title>Clarity V2 desktop</title>
    <style>
      body {
        margin: 0;
        font:
          1rem system-ui,
          sans-serif;
        color: #142139;
        background: #f6f9fd;
      }
      main {
        max-width: 42rem;
        margin: 15vh auto;
        padding: 2rem;
      }
      small {
        color: #286aa8;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0.8rem 0;
        font-size: clamp(2rem, 6vw, 3.5rem);
        letter-spacing: -0.05em;
      }
      p {
        line-height: 1.6;
        color: #50627a;
      }
      .card {
        padding: 1.5rem;
        border: 1px solid #dce4f0;
        border-radius: 1rem;
        background: white;
      }
    </style>
  </head>
  <body>
    <main>
      <small>Clarity Diagnostics · V2</small>
      <h1>Desktop foundation</h1>
      <div class="card">
        <p>
          This installed shell has not been connected to staff sign-in or the local Orthanc source.
        </p>
        <p>The background sync service and cloud dashboard are separate implementation steps.</p>
      </div>
    </main>
  </body>
</html>
