name: Windows service scaffold

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-synthetic-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Assemble and smoke launch the compiled Windows release
        shell: pwsh
        run: |
          $release = Join-Path $env:RUNNER_TEMP 'clarity-sync-release'
          ./deploy/windows/build-release.ps1 -Version '0.1.0-ci' -OutputDirectory $release
          "CLARITY_RELEASE_DIR=$release" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WINSW_LOCAL_ARTIFACT=$(Join-Path $release 'ClaritySyncService.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify service XML and compiled release contract
        run: python -m unittest discover -s deploy/windows -p "test_*.py" -v
